name: libghostty-vt bindings

# gui/ghostty-vt-sys/src/bindings.rs is committed so building the GUI needs
# no libclang. This checks it still matches the pinned libghostty-vt headers,
# and that the one file still serves Windows (MSVC).
# To update it: download the job's bindings.rs artifact and commit it, or
# in gui/ run `cargo run -p ghostty-vt-bindgen -- "$(msh ghostty-vt-sys/fetch.msh --source)"`.

on:
  push:
    paths:
      - 'gui/ghostty-vt-sys/**'
      - 'gui/ghostty-vt-bindgen/**'
      - 'gui/Cargo.lock'
      - '.github/workflows/ghostty-bindings.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        cache-dependency-path: mshell/go.sum
        go-version-file: 'mshell/go.mod'

    - name: Build msh
      run: |
        cd mshell && go build -o msh
        realpath . >> "$GITHUB_PATH"
        printf "MSHSTDLIB=%s\n" "$(realpath ../lib/std.msh)" >> "$GITHUB_ENV"

    - name: Install libclang
      run: sudo apt-get update && sudo apt-get install -y libclang-dev

    - name: Download libghostty-vt source
      run: cd gui && echo "GHOSTTY_SRC=$(msh ghostty-vt-sys/fetch.msh --source)" >> "$GITHUB_ENV"

    - name: Check bindings
      run: cd gui && cargo run --locked -p ghostty-vt-bindgen -- --check "$GHOSTTY_SRC"

    - name: Generate bindings
      if: failure()
      run: cd gui && cargo run --locked -p ghostty-vt-bindgen -- "$GHOSTTY_SRC"

    - name: Upload generated bindings
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        path: gui/ghostty-vt-sys/src/bindings.rs
        archive: false
