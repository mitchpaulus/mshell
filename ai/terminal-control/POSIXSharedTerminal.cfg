\* The parallel-runner profile discovered 2026-08-13: the shell shares a
\* terminal it does not own (redo -j, make -j, a backgrounded script).  The
\* ownership gate must keep it from ever foregrounding a job or recording a
\* previous owner to restore.
CONSTANTS
    Procs = {p1, p2}
    ShellPgrp = shellPgrp
    JobPgrp = jobPgrp
    OtherPgrp = otherPgrp
    ShellStartsForeground = FALSE
    ShellStdinIsTTY = TRUE
    ChildStdinIsTTY = TRUE

INIT Init
NEXT Next

INVARIANTS
    TypeOK
    ShellReaderHasForeground
    JobForegroundPausesShell
    RunningProcessesAreGroupedBeforeForeground
    PromptModeIsRestored
    ResolvedChildEndpointControlsHandoff
    NonOwnerShellNeverForegrounds
